{% extends "base.html" %}
{% block title %}Choose a new password | SecurePass{% endblock %}

{% block content %}
<section class="container auth-page">
  <div class="auth-card">
    <h1>Choose a new password</h1>
    <p class="auth-sub">At least 10 characters, with a letter and a number.</p>

    {% if problem %}<div class="error-summary" role="alert">{{ problem }}</div>{% endif %}

    <form method="post" novalidate>
      {{ form.hidden_tag() }}
      <div class="field">
        <label for="password">New password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" maxlength="128" required>
      </div>
      <div class="field">
        <label for="confirm">Confirm new password</label>
        <input id="confirm" name="confirm" type="password" autocomplete="new-password" maxlength="128" required>
      </div>
      <button class="btn btn-solid btn-block" type="submit">Save the new password</button>
    </form>
  </div>
</section>
{% endblock %}
