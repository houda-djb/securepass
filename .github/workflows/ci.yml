name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the pipeline can only read the repository.
permissions:
  contents: read

# A new push cancels the older run of the same branch, so results are never stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Tests with coverage gate (fails below 90%)
        run: pytest -q --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Bandit (static security analysis, fails on medium or high findings)
        run: bandit -r app config.py -ll

      - name: pip-audit (known vulnerabilities in dependencies)
        run: pip-audit -r requirements.txt

      # Reports are kept even when a gate above failed, so the cause is easy to read.
      - name: Write scan reports
        if: always()
        run: |
          bandit -r app config.py -f json -o bandit-report.json --exit-zero || true
          pip-audit -r requirements.txt -f json -o pip-audit-report.json || true

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
            coverage.xml
          if-no-files-found: ignore
          retention-days: 30

  # The same tests again, on the database used in production (PostgreSQL), because SQLite
  # and PostgreSQL differ in small ways that only a real server shows.
  tests-on-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: securepass_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci-only@localhost:5432/securepass_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Whole test suite on PostgreSQL
        run: pytest -q -p tests.postgres_isolation

  # Builds the container image, then starts it against PostgreSQL to prove it really works.
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: securepass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build -t securepass:ci .

      - name: The app must not run as root
        run: test "$(docker run --rm securepass:ci id -u)" != "0"

      - name: Start it and check the health page
        run: |
          docker run -d --name securepass --network host \
            -e DATABASE_URL=postgresql://postgres:ci-only@localhost:5432/securepass \
            -e SECRET_KEY="ci-only-$(openssl rand -hex 24)" \
            -e FLASK_ENV=development -e PORT=8000 securepass:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz; then exit 0; fi
            sleep 2
          done
          docker logs securepass
          exit 1
