# Render Blueprint: one Docker web service plus a PostgreSQL database, both on the free plan.
# Secrets are never written here: SECRET_KEY is generated by Render, DATABASE_URL comes from
# the database itself.
services:
  - type: web
    name: securepass
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PROXY_HOPS
        value: "1"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      # Render asks for these two when you create the Blueprint. The free plan has no shell, so
      # this is how the first admin is made. Delete ADMIN_PASSWORD from the dashboard afterwards.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: securepass-db
          property: connectionString

databases:
  - name: securepass-db
    plan: free
    databaseName: securepass
    user: securepass
    ipAllowList: []   # no outside connections: only the web service can reach the database
